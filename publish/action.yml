name: "Publish Packaged Rust Binaries as a GitHub Release"
author: "Dave Rolsky <autarch@urth.org>"
branding:
  icon: home
  color: gray-dark
description: |
  This action collects the archives uploaded by the `houseabsolute/actions-rust-release` action
  and publishes them as a single GitHub release. Run it once, from a job that runs after all of
  your build jobs have succeeded.

  This action must run on a Linux runner, and fails immediately if it does not. Unlike the packaging
  action, it does not touch your build output, so there is no reason to run it anywhere else.

  The job running this action needs both the `contents: write` and `actions: read` permissions.
inputs:
  executable-name:
    description: |
      The name of the executable, which is used to construct the default `artifact-regex`. In most
      cases, this is just the name of your project, like `cross` or `mise`.

      Either this input or the `artifact-regex` input must be provided.

  artifact-regex:
    description: |
      A Python regex matching the names of the workflow run's artifacts that should be attached to
      the release. Artifacts which do not match are left alone, so this is how you keep things like
      coverage reports or logs out of your releases.

      The default is `\A<executable-name>.*\.(tar\.[a-z]+|zip)\Z`, which matches every archive
      created by the `houseabsolute/actions-rust-release` action for the given executable.

      Either this input or the `executable-name` input must be provided.

  release-tag-regex:
    description: |
      A Python regex matching the tags which should produce a release. It is matched against the tag
      name with `re.match`, so it is anchored at the start whether or not you write a `^`.

      The default matches a semantic version with an optional leading "v", so "v1.2.3", "1.2.3",
      "v1.2.3-rc1", and "v1.2.3+build4" all produce a release, while a tag like "nightly" or
      "v-2026-07-26" does not.

      This is only consulted for tags. A push to a branch never produces a release.
    default: '^v?\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

  changes-file:
    description: |
      The name of the file that contains the changelog for this project. This will be used to
      generate a description for the GitHub Release. The default is `Changes.md`. This is looked
      for in the `working-directory`.
    default: "Changes.md"

  working-directory:
    description: |
      The current working directory in which the Rust project is. It defaults to "." so the
      current working directory.
    default: "."

  release-name:
    description: |
      The title of the release. If this is not set, GitHub uses the tag name.

  generate-release-notes:
    description: |
      Set this to "true" to have GitHub generate the release notes from the commits and pull
      requests since the last release. This is combined with the `changes-file` if you set both.
    default: "false"

  draft:
    description: |
      Set this to "true" to create the release as a draft, so you can review it before publishing.
    default: "false"

  prerelease:
    description: |
      Set this to "true" to mark the release as a prerelease.
    default: "false"

  latest:
    description: |
      Set this to "true" or "false" to control whether the release is marked as the latest one. If
      this is left unset, GitHub decides based on the release date, which is what you usually want.

  target:
    description: |
      The branch name or commit SHA that the tag is created from, if the tag does not already
      exist. This defaults to the repository's default branch.

  discussion-category:
    description: |
      The name of a discussion category. If this is set, the release creates a discussion in that
      category.

  repository:
    description: |
      The `owner/repo` to create the release in. This defaults to the repository running the
      workflow. If you set this, you almost certainly need to set the `token` input too, since the
      default token has no access to another repository.
    default: ${{ github.repository }}

  token:
    description: |
      The token used to create the release. This defaults to the workflow's own token, which needs
      the `contents: write` permission.
    default: ${{ github.token }}

  _force-release-for-testing:
    description: |
      This exists to let me test the release parts of this action.

outputs:
  artifact-ids:
    description: |
      A comma-separated list of the IDs of the artifacts that were attached to the release.
    value: ${{ steps.find-artifacts.outputs.artifact-ids }}

runs:
  using: composite
  steps:
    - name: Check that this is a Linux runner
      shell: bash
      run: |
        echo "The publish action must run on a Linux runner, but this job is running on" \
             "$RUNNER_OS_NAME. Move this step to a job with 'runs-on: ubuntu-latest' or" \
             "similar. Only the packaging action needs to run on the platform you built for." >&2
        exit 1
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
      if: runner.os != 'Linux'

    - name: Show inputs
      shell: bash
      run: |
        echo "$INPUTS"
      env:
        INPUTS: ${{ toJSON(inputs) }}

    - name: Add this action's path to PATH
      shell: bash
      run: echo "$ACTION_PATH/.." >> "$GITHUB_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}

    - name: Validate inputs
      shell: bash
      run: |
        validate-inputs.py --mode publish "$GITHUB_WORKSPACE_DIR"
      env:
        GITHUB_WORKSPACE_DIR: ${{ github.workspace }}
        INPUTS_executable_name: ${{ inputs.executable-name }}
        INPUTS_artifact_regex: ${{ inputs.artifact-regex }}
        INPUTS_release_tag_regex: ${{ inputs.release-tag-regex }}
        INPUTS_changes_file: ${{ inputs.changes-file }}
        INPUTS_working_directory: ${{ inputs.working-directory }}
        INPUTS_latest: ${{ inputs.latest }}

    - name: Determine whether a release should be published
      id: determine-if-releasing
      shell: bash
      run: |
        set-should-release.py
      env:
        # The regex comes from an env var to avoid any string interpolation issues, since it will
        # contain backslashes and quotes.
        RELEASE_TAG_REGEX: ${{ inputs.release-tag-regex }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        FORCE_RELEASE: ${{ inputs._force-release-for-testing }}

    - name: Find the release artifacts for this run
      id: find-artifacts
      shell: bash
      run: |
        set -e
        set -x
        set -o pipefail

        # Everything comes from env vars to avoid any string interpolation issues, since the regex
        # will contain backslashes and quotes. The token comes from one so that it never appears in
        # the process table.
        find-release-artifacts.py \
            --executable-name "$INPUTS_executable_name" \
            --artifact-regex "$ARTIFACT_REGEX" \
            --repo "$REPO" \
            --run-id "$RUN_ID" \
            --api-url "$API_URL"
      env:
        INPUTS_executable_name: ${{ inputs.executable-name }}
        ARTIFACT_REGEX: ${{ inputs.artifact-regex }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ github.token }}
      if: steps.determine-if-releasing.outputs.should-release == 'true'

    - name: Download the release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.find-artifacts.outputs.artifact-ids }}
        path: ${{ runner.temp }}/release-artifacts
        merge-multiple: true
      # An empty `artifact-ids` makes this action download *every* artifact in the run, so this is
      # gated on the previous step's output rather than on the tag, which would let the two
      # conditions drift apart.
      if: steps.find-artifacts.outputs.artifact-ids != ''

    - name: Create the GitHub release
      shell: bash
      run: |
        set -e
        set -x
        set -o pipefail

        TAG="$REF_NAME"
        if [ "$FORCE_RELEASE" = "true" ]; then
            workflow_path="${WORKFLOW_REF%%@*}"
            workflow_file=$(basename "$workflow_path")
            timestamp=$( TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H-%M-%S )
            TAG="v-$timestamp-$REF_NAME-$SHA-$RUN_NUMBER-$workflow_file"
        fi

        # Everything comes from env vars rather than being interpolated into this script, and the
        # token is only ever in the environment, so it never shows up in the process table. The
        # `--opt=value` form is deliberate - with a space, argparse reads a value that starts with
        # a "-" as another option, and "-v1" is a legal git tag.
        create-release.py \
            --tag="$TAG" \
            --artifact-directory="$RUNNER_TEMP/release-artifacts" \
            --working-directory="$INPUTS_working_directory" \
            --changes-file="$INPUTS_changes_file" \
            --release-name="$INPUTS_release_name" \
            --target="$INPUTS_target" \
            --repository="$INPUTS_repository" \
            --discussion-category="$INPUTS_discussion_category" \
            --draft="$INPUTS_draft" \
            --prerelease="$INPUTS_prerelease" \
            --generate-release-notes="$INPUTS_generate_release_notes" \
            --latest="$INPUTS_latest"
      env:
        FORCE_RELEASE: ${{ steps.determine-if-releasing.outputs.force-release }}
        GH_TOKEN: ${{ inputs.token }}
        INPUTS_changes_file: ${{ inputs.changes-file }}
        INPUTS_discussion_category: ${{ inputs.discussion-category }}
        INPUTS_draft: ${{ inputs.draft }}
        INPUTS_generate_release_notes: ${{ inputs.generate-release-notes }}
        INPUTS_latest: ${{ inputs.latest }}
        INPUTS_prerelease: ${{ inputs.prerelease }}
        INPUTS_release_name: ${{ inputs.release-name }}
        INPUTS_repository: ${{ inputs.repository }}
        INPUTS_target: ${{ inputs.target }}
        INPUTS_working_directory: ${{ inputs.working-directory }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
        SHA: ${{ github.sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      if: steps.determine-if-releasing.outputs.should-release == 'true'
