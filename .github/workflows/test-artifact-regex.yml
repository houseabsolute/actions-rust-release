name: Test artifact-regex Parameter

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v0' }}

permissions:
  contents: read

jobs:
  package:
    name: Package one target and upload a decoy artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy test project to root
        shell: bash
        run: |
          cp -a test-project/* .
          rm -fr test-project
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          args: "--release"
          target: x86_64-unknown-linux-gnu
          GITHUB_TOKEN: ${{ github.token }}
      - name: Package
        id: package
        uses: ./
        with:
          executable-name: test-project
          target: x86_64-unknown-linux-gnu
      # This is the sort of artifact that a real workflow uploads alongside its release archives.
      # It must never end up attached to a release.
      - name: Upload a decoy artifact
        shell: bash
        run: echo "not a release archive" > decoy.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-project-coverage-report
          path: decoy.txt

  release:
    name: Publish only the archives
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read # The publish action lists this run's artifacts to pick the ones to release.
      # These tests release to a separate repo using the token passed in via the
      # `token` input, so no write access to this repo is needed.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release
        id: publish
        uses: ./publish
        with:
          executable-name: test-project
          # We always do a release during tests, just to make sure that the release part of the
          # action works.
          _force-release-for-testing: true
          draft: true
          repository: houseabsolute/actions-rust-release-testing
          token: ${{ secrets.ACTIONS_RUST_RELEASE_TESTING_TOKEN }}
      # The publish action tells us which artifacts it picked, so we can check that the decoy was
      # left behind without having to inspect the release itself.
      - name: Check that only the archive was released
        shell: bash
        run: |
          set -e
          set -o pipefail

          ids="$ARTIFACT_IDS"
          echo "Released artifact IDs: $ids"

          count=$(echo "$ids" | tr ',' '\n' | grep -c . || true)
          if [ "$count" -ne 1 ]; then
              echo "Expected exactly 1 released artifact, but got $count."
              exit 1
          fi

          decoy_id=$(
              gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
                  --jq '.artifacts[] | select(.name == "test-project-coverage-report") | .id'
          )
          if [ -z "$decoy_id" ]; then
              echo "Could not find the decoy artifact, so this test proves nothing."
              exit 1
          fi
          if [ "$ids" = "$decoy_id" ]; then
              echo "The decoy artifact was released."
              exit 1
          fi
        env:
          ARTIFACT_IDS: ${{ steps.publish.outputs.artifact-ids }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
