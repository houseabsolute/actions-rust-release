name: Test working-directory Parameter

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - platform_name: Linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cache-cross-binary: true
          - platform_name: Linux-powerpc64
            os: ubuntu-24.04
            target: powerpc64-unknown-linux-gnu
            cache-cross-binary: true
          - platform_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform_name: macOS-aarch64
            os: macOS-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Copy test project to root
        shell: bash
        run: |
          cp -a test-project/* .
          rm -fr test-project
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          args: "--release"
          working-directory: sub-project
          target: ${{ matrix.platform.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package sub project
        id: release
        uses: ./
        with:
          executable-name: sub-project
          working-directory: sub-project
          target: ${{ matrix.platform.target }}
      - name: Install psutils on Windows
        run: choco install --ignore-checksums psutils
        if: runner.os == 'Windows'
      - name: Check release artifacts
        shell: bash
        run: |
          ./tests/check-release.py \
              --artifact-id "${{ steps.release.outputs.artifact-id }}" \
              --executable-name sub-project \
              --github-token "${{ github.token }}" \
              --repo houseabsolute/actions-rust-release \
              --target "${{ matrix.platform.target }}"

  release:
    name: Publish the sub project release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Copy test project to root
        shell: bash
        run: |
          cp -a test-project/* .
          rm -fr test-project
      - name: Publish release
        uses: ./publish
        with:
          executable-name: sub-project
          # The changes file for this release lives in the sub project, not the repo root.
          working-directory: sub-project
          # We always do a release during tests, just to make sure that the release part of the
          # action works.
          _force-release-for-testing: true
          action-gh-release-parameters: |
            {
                "repository": "houseabsolute/actions-rust-release-testing",
                "token": "${{ secrets.ACTIONS_RUST_RELEASE_TESTING_TOKEN }}"
            }
