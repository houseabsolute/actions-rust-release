name: Test Release

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v0' }}

permissions:
  contents: read

jobs:
  # The platforms live here rather than inline in the `test` job so that the `release` job can work
  # out how many assets the release should end up with. Hard coding that number means adding a
  # platform quietly stops checking that every platform made it into the release.
  platforms:
    name: Work out which platforms to build for
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      asset-count: ${{ steps.platforms.outputs.asset-count }}
    steps:
      - name: List the platforms
        id: platforms
        shell: bash
        run: |
          set -e
          set -o pipefail

          platforms=$(
              cat <<'JSON'
          [
            {
              "os-name": "Linux-x86_64",
              "runs-on": "ubuntu-24.04",
              "target": "x86_64-unknown-linux-gnu",
              "cache-cross-binary": true
            },
            {
              "os-name": "Linux-powerpc64",
              "runs-on": "ubuntu-24.04",
              "target": "powerpc64-unknown-linux-gnu",
              "cache-cross-binary": true
            },
            {
              "os-name": "Windows-x86_64",
              "runs-on": "windows-latest",
              "target": "x86_64-pc-windows-msvc"
            },
            {
              "os-name": "macOS-aarch64",
              "runs-on": "macOS-latest",
              "target": "aarch64-apple-darwin"
            }
          ]
          JSON
          )

          echo "platforms=$( jq --compact-output . <<<"$platforms" )" >> "$GITHUB_OUTPUT"
          # Each platform contributes an archive and its checksum file to the release.
          echo "asset-count=$(( $( jq length <<<"$platforms" ) * 2 ))" >> "$GITHUB_OUTPUT"

  test:
    name: Test - ${{ matrix.platform.os-name }}
    needs: platforms
    permissions:
      actions: read # `tests/check-release.py` downloads this run's packaged artifact.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.platforms) }}

    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy test project to root
        shell: bash
        run: |
          cp -a test-project/* .
          rm -fr test-project
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          args: "--release"
          target: ${{ matrix.platform.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        id: release
        uses: ./
        with:
          executable-name: test-project
          target: ${{ matrix.platform.target }}
      - name: Install psutils on Windows
        run: choco install --ignore-checksums psutils
        if: runner.os == 'Windows'
      - name: Check release artifacts
        shell: bash
        run: |
          ./tests/check-release.py \
              --artifact-id "$ARTIFACT_ID" \
              --executable-name test-project \
              --github-token "$GITHUB_TOKEN" \
              --repo houseabsolute/actions-rust-release \
              --target "$TARGET"
        env:
          ARTIFACT_ID: ${{ steps.release.outputs.artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.platform.target }}

  release:
    name: Publish the packaged archives as one release
    needs: [platforms, test]
    # Only on a push. This job publishes a real release into the testing repository, and a branch
    # with an open PR fires both events, which would make two releases for one commit. The token
    # is also not available to a run from a fork, so this could not work there anyway.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read # The publish action lists this run's artifacts to pick the ones to release.
      # These tests release to a separate repo using the token passed in via the
      # `token` input, so no write access to this repo is needed.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release
        id: publish
        uses: ./publish
        with:
          executable-name: test-project
          # We always do a release during tests, just to make sure that the release part of the
          # action works.
          _force-release-for-testing: true
          repository: houseabsolute/actions-rust-release-testing
          token: ${{ secrets.ACTIONS_RUST_RELEASE_TESTING_TOKEN }}
          # This workflow sets the inputs that shape the release, so that the next step can check
          # that each one actually reached GitHub. The other test workflows leave them alone,
          # which covers the defaults. `changes-file` and `target-commitish` are left at their
          # defaults here, because the other workflows already cover those.
          release-name: Test release for ${{ github.sha }}
          generate-release-notes: true
          # This one publishes for real rather than creating a draft. The testing repository has
          # immutable releases turned on, and a release only becomes immutable when it is
          # published, so this is the only way to find out whether the create-as-draft, upload,
          # then publish sequence really works. test-no-changes-file.yml covers the draft case.
          draft: false
          prerelease: false
          # `latest` has to become a single `--latest=false` argument. Split into two, `gh` would
          # read the "false" as another file to upload, which the asset check below catches.
          #
          # Whether the flag was honoured cannot be checked. There is no `isLatest` field in
          # `gh release view`, and the `releases/latest` API endpoint returns the newest published
          # release whether or not `make_latest` was set to false, so it says nothing here.
          latest: false
      - name: Check the release
        shell: bash
        run: |
          ./tests/verify-release.py \
              --tag "$TAG" \
              --repository houseabsolute/actions-rust-release-testing \
              --executable-name test-project \
              --expect-title "Test release for $SHA" \
              --expect-immutable \
              --expect-notes-from Changes.md \
              --expect-generated-notes \
              --expect-asset-count "$ASSET_COUNT"
        env:
          ASSET_COUNT: ${{ needs.platforms.outputs.asset-count }}
          GH_TOKEN: ${{ secrets.ACTIONS_RUST_RELEASE_TESTING_TOKEN }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.publish.outputs.release-tag }}

  test-scripts:
    name: Test the Python scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        shell: bash
        run: |
          set -e
          ./validate-inputs.py --test
          ./find-release-artifacts.py --test
          ./set-should-release.py --test
          ./create-release.py --test
          ./make-archive.py --test
          ./tests/verify-release.py --test
