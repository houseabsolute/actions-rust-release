rules:
  # Both actions put their own directory on PATH so that the Python helpers next to the action.yml
  # can be run by name. The value written is `github.action_path`, which GitHub sets to the checkout
  # of this action, so there is no caller-controlled input involved. The ignore key matches on file
  # name, so `action.yml` covers both this repo's action.yml and publish/action.yml.
  github-env:
    ignore:
      - action.yml
