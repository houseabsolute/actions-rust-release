exclude = ["target"]

[commands."ruff for linting"]
type = "both"
include = ["*.py"]
cmd = "ruff"
lint_flags = ["check"]
tidy_flags = ["check", "--fix"]
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands."ruff for tidying"]
type = "both"
include = ["*.py"]
cmd = "ruff"
lint_flags = ["format", "--check"]
tidy_flags = ["format"]
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.oxfmt]
type = "both"
include = ["*.md", "*.yml", "*.toml"]
cmd = ["oxfmt"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = ["omegasort", "--sort", "path", "--unique"]
lint-flags = "--check"
tidy-flags = "--in-place"
ok-exit-codes = 0
lint-failure-exit-codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.shellcheck]
type = "lint"
include = "*.sh"
cmd = "shellcheck"
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.shfmt]
type = "both"
include = "*.sh"
cmd = ["shfmt", "--simplify", "--indent", "4"]
lint_flags = "--diff"
tidy_flags = "--write"
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.typos]
type = "both"
include = "*"
cmd = "typos"
tidy_flags = "--write-changes"
invoke = "once"
ok-exit-codes = 0
lint-failure-exit-codes = 2

[commands.zizmor]
type = "lint"
include = ".github/**/*.yml"
invoke = "once"
path-args = "none"
working-dir = "root"
cmd = ["zizmor", "--persona", "pedantic", "."]
ok-exit-codes = 0
# zizmor exits with 11-14 depending on the severity of the worst finding. Every
# other non-zero code means zizmor itself failed - 1 for an audit error, 2 for
# bad arguments, 3 for collecting no inputs at all - and none of those are lint
# failures, so precious should treat them as hard errors.
lint-failure-exit-codes = [11, 12, 13, 14]
expect-stderr = true
